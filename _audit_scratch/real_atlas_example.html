<!doctype html><html lang="es"><meta charset="utf-8"><title>Ejemplo real Atlas</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eaf0f7;font-family:Inter,Segoe UI,Arial,sans-serif}main{width:min(620px,92vw)}h1{margin:0 0 8px;color:#101828;font-size:27px}p{margin:0 0 22px;color:#475467}.frame{background:#fff;border-radius:18px;padding:22px;box-shadow:0 18px 45px rgba(16,24,40,.12)}#asset svg{display:block;width:100%;height:auto}</style><main><h1>Ejemplo real · Funciones</h1><p>Primer recurso del bloque «Concepto de función y formas de representación».</p><div class="frame" id="asset"></div></main><script>fetch('../bundles/eso_matematicas__mat_funciones_representacion.json').then(r=>r.json()).then(data=>{let first;const walk=x=>{if(first)return;if(x&&typeof x==='object'){if(typeof x.svg==='string'&&x.svg.includes('<svg'))first=x.svg;else Object.values(x).forEach(walk)}};walk(data);document.querySelector('#asset').innerHTML=first;});</script></html>
