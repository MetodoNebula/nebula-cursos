<!doctype html><html><meta charset="utf-8"><body><div id="host"></div><script>
fetch('atlas_refined/atlas-refined.svg').then(r => r.text()).then(markup => {
  document.querySelector('#host').innerHTML = markup;
  const texts = [...document.querySelectorAll('svg text')].map((element, index) => {
    const box = element.getBBox();
    return { index, text: element.textContent.trim(), x: box.x, y: box.y, width: box.width, height: box.height };
  });
  const overlaps = [];
  for (let i = 0; i < texts.length; i += 1) for (let j = i + 1; j < texts.length; j += 1) {
    const a = texts[i], b = texts[j];
    const width = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
    const height = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
    if (width * height > 0.5) overlaps.push({ a: a.text, b: b.text, area: Number((width * height).toFixed(2)) });
  }
  const output = document.createElement('pre');
  output.textContent = JSON.stringify({ labels: texts.length, overlaps });
  document.body.replaceChildren(output);
});
</script></body></html>
