<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Vega · Cobalto y Coral: representación de una función cuadrática</title>
  <desc id="desc">Una parábola con los ejes cartesianos, vértice, eje de simetría y una etiqueta de crecimiento. Todos los rótulos usan fondo sólido y alto contraste.</desc>
