<figure><figcaption>Ecuaciones</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="nebula-equation-title nebula-equation-desc" preserveAspectRatio="xMidYMid meet" focusable="false" data-nebula-atlas="prototype-v2">

<figure><figcaption>Probabilidad</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="nebula-tree-title nebula-tree-desc" preserveAspectRatio="xMidYMid meet" focusable="false" data-nebula-atlas="prototype-v2">
