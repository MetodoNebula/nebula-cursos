<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" font-family="sans-serif" font-size="12">
  <!-- bloque s: grupos 1-2, periodos 1-7 -->
  <rect x="20" y="20" width="60" height="160" fill="#a8d1ff" stroke="#333"/>
  <text x="50" y="105" text-anchor="middle">s</text>
  <!-- bloque d: grupos 3-12, periodos 4-7 -->
  <rect x="80" y="100" width="180" height="80" fill="#ffd6a8" stroke="#333"/>
  <text x="170" y="145" text-anchor="middle">d (periodos 4-7)</text>
  <!-- bloque p: grupos 13-18, periodos 2-7 -->
  <rect x="260" y="40" width="120" height="140" fill="#b8e8b0" stroke="#333"/>
  <text x="320" y="115" text-anchor="middle">p</text>
  <!-- celda del He: grupo 18, periodo 1, coloreada como bloque s -->
  <rect x="380" y="20" width="40" height="20" fill="#a8d1ff" stroke="#333"/>
  <text x="400" y="34" text-anchor="middle" font-size="10">He</text>
  <text x="400" y="10" text-anchor="middle" font-size="9">He: bloque s</text>
  <!-- bloque f, aparte -->
  <rect x="80" y="195" width="180" height="20" fill="#e7b8e8" stroke="#333"/>
  <text x="170" y="209" text-anchor="middle" font-size="10">f (periodos 6-7, aparte)</text>
</svg>