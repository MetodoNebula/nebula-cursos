<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula Cursos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna (max 960px), navegación por niveles curso→unidad→lección, pestañas por tipo de contenido */
:root{
  --bg:#f6f7f6;
  --panel:#ffffff;
  --ink:#1c2422;
  --muted:#5c6b67;
  --line:#dde3e0;
  --accent:#0e6e64;
  --accent-soft:#e2efed;
  --info:#2f74b5;
  --info-soft:#e3edf7;
  --amber:#b46a0a;
  --good:#1b7d3d;
  --good-soft:#e2f2e7;
  --bad:#b03030;
  --bad-soft:#f9e7e7;
  --hl-purple:#7e3fb4;
  --sans:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Code',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10100f; --panel:#1a1d1c; --ink:#e8ecea; --muted:#9fa8a3; --line:#31403c;
    --accent:#4fb3a6; --accent-soft:#17332f; --info:#6badec; --info-soft:#152636; --amber:#d79a43;
    --good:#5cc083; --good-soft:#1b3324; --bad:#e08484; --bad-soft:#3a2020; --hl-purple:#c9a3f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141716; --panel:#1a1d1c; --ink:#e8ecea; --muted:#9fa8a3; --line:#2a312e;
  --accent:#4fb3a6; --accent-soft:#17332f; --info:#6badec; --info-soft:#152636; --amber:#d79a43;
  --good:#5cc083; --good-soft:#1b3324; --bad:#e08484; --bad-soft:#3a2020; --hl-purple:#c9a3f0;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:960px;margin:0 auto;padding-block:0 48px;padding-inline:16px}
header.app{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;color:var(--accent);cursor:pointer;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:13.5px;color:var(--muted);overflow:hidden}
.crumbs a{color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.5}
h1{font-size:26px;line-height:1.2;margin:26px 0 6px;text-wrap:balance}
h2{font-size:19px;margin:30px 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.grouplabel{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700;font-size:16.5px;margin:0 0 4px}
.card .m{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:baseline;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .n{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:26px;font-weight:600}
.row .t{flex:1;min-width:0;font-weight:600;font-size:15.5px}
.row .meta{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:12.5px;white-space:nowrap}
.dots{letter-spacing:2px;font-size:11px;color:var(--amber)}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.3px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tabs button{flex-shrink:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ejbatchbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.ejbatchbar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer}
.ejbatchbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ejbatchbar button:hover{border-color:var(--accent);color:var(--accent)}
.ejbatchbar button.on:hover{color:#fff}
.tabs button:focus-visible,.row:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px 18px 26px;margin:14px 0}
.block h3{margin:0 0 8px;font-size:16.5px}
.block .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.block p{margin:.62em 0;max-width:68ch;line-height:1.58}
.block p + p{margin-top:1.05em}
.block mjx-container[display="true"]{margin:1em 0!important}
.theory-formula{margin:.9rem 0 1.1rem;padding:.65rem .9rem;border-left:3px solid #2563eb;background:#f8fafc;border-radius:0 .45rem .45rem 0;overflow-x:auto}
.theory-formula mjx-container[display="true"]{margin:.15rem 0!important}
.theory-formula .formula-line + .formula-line{border-top:1px solid var(--line);margin-top:.55rem;padding-top:.55rem}
.block ul,.block ol{margin:.5em 0;padding-left:1.3em;max-width:70ch}
.block li{margin:.3em 0}
.block{border-left:4px solid transparent}
.block.t-intuition{border-left-color:var(--info)}
.block.t-intuition .tag{color:var(--info)}
.block.t-caveat{border-left-color:var(--bad)}
.block.t-caveat .tag{color:var(--bad)}
.block.t-worked_rule{background:var(--accent-soft);border-left-color:var(--accent)}
.block.t-worked_rule .tag{color:var(--accent)}
.block.t-connection{border-left-color:var(--amber)}
.block.t-connection .tag{color:var(--amber)}
.block.t-enrichment{border-left-color:var(--hl-purple)}
.block.t-enrichment .tag{color:var(--hl-purple)}
.overview{background:var(--info-soft);border:1px solid var(--info);border-radius:10px;padding:18px 20px;margin:14px 0}
.overview .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--info);display:block;margin-bottom:6px}
.overview p{margin:.4em 0;max-width:72ch}
.callout{border-radius:8px;padding:10px 13px;margin:.7em 0 0;font-size:14px;max-width:72ch}
.callout.warn{background:var(--bad-soft)}
.callout.warn strong{color:var(--bad)}
.callout.info{background:var(--accent-soft)}
.callout.info strong{color:var(--accent)}
.concept-hint{line-height:1.5}
.sol-flow{margin:.7em 0 0;max-width:72ch;display:flex;flex-direction:column;gap:8px}
.sol-flow p{margin:0;padding:.58rem .75rem;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.62}
.sol-flow p.final{font-weight:600;background:var(--good-soft);border-color:var(--good);border-left-width:4px}
.adg-venn-a{fill:#0e7a68;fill-opacity:.32;stroke:#0e7a68;stroke-width:2}
.adg-venn-b{fill:#c17a17;fill-opacity:.32;stroke:#c17a17;stroke-width:2}
.adg-vlabel{font-size:12.5px;font-weight:700;fill:#20302a;font-family:var(--sans)}
.adg-vcount{font-size:15px;font-weight:700;fill:#20302a;font-family:var(--mono)}
.adg-vcount-neither{font-size:11.5px;fill:#5c6b67;font-family:var(--mono)}
.adg-venn-box{stroke:#c7d0cb;stroke-width:1.2}
.adg-bar{fill:#0e7a68;fill-opacity:.88}
.adg-bar2{fill:#c17a17;fill-opacity:.88}
.adg-bar-val{font-size:10.5px;fill:#20302a;font-family:var(--mono)}
.adg-bar-label{font-size:9.5px;fill:#5c6b67;font-family:var(--sans)}
.adg-normal-curve{stroke:#0e7a68;stroke-width:2.2}
.adg-normal-shade{fill:#c17a17;fill-opacity:.35}
.adg-legend-text{font-size:10.5px;fill:#20302a;font-family:var(--sans)}
.formula-row{margin:.75em 0;padding:.65rem .9rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.qtitle{margin:0 0 8px;font-size:16px;color:var(--accent)}
details{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--bg)}
details summary{cursor:pointer;padding:9px 13px;font-weight:600;font-size:14px;color:var(--accent);list-style-position:inside}
details[open] summary{border-bottom:1px solid var(--line)}
details .inner{padding:10px 14px}
.kwtable{width:100%;border-collapse:collapse;font-size:14.5px}
.kwtable td{border-top:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top}
.kwtable td:first-child{font-weight:700;white-space:nowrap;padding-right:16px;color:var(--accent)}
.kwwrap{overflow-x:auto}
.mdtable{width:100%;border-collapse:collapse;font-size:14.5px;margin:.6em 0}
.mdtable th{border-bottom:2px solid var(--line);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);white-space:nowrap}
.mdtable td{border-top:1px solid var(--line);padding:7px 10px}
/* flashcards */
.fcstage{display:flex;flex-direction:column;align-items:center;gap:14px;margin:18px 0}
.fcounter{font-family:var(--mono);font-size:13px;color:var(--muted)}
.fcard{width:100%;max-width:560px;min-height:240px;perspective:1200px;cursor:pointer}
.fcin{position:relative;width:100%;min-height:240px;transform-style:preserve-3d;transition:transform .45s}
@media (prefers-reduced-motion: reduce){.fcin{transition:none}}
.fcard.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:17px;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .lbl{position:absolute;top:10px;left:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--sans);font-weight:600;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
/* mcq */
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.q .stem{font-weight:600;margin-bottom:10px}
.kw-setup{color:var(--muted);font-size:14px;margin:0 0 10px;padding:8px 12px;background:var(--bg);border-radius:8px}
.kw-setup p{margin:.25em 0}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px;cursor:pointer;font-family:var(--sans);font-size:14.5px;line-height:1.45}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--accent)}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.verdict{margin-top:10px;font-size:14px;border-radius:8px;padding:10px 12px}
.verdict.ok{background:var(--good-soft);color:var(--ink)}
.verdict.ko{background:var(--bad-soft);color:var(--ink)}
.marks{font-family:var(--mono);font-size:12px;color:var(--amber);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:18px 0}
.loading{color:var(--muted);padding:40px 0;text-align:center;font-size:15px}
.fig{background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:12px;margin:14px 0;overflow-x:auto}
/* resaltado de color: [[blue:texto]] en markdown y \color{blue}{...}/\color{red}{...}/etc en LaTeX
   usan la MISMA paleta, consciente del tema claro/oscuro, para que una variable destaque igual
   en la prosa que dentro de una formula. Los nombres validos en LaTeX (los unicos que el paquete
   color de MathJax reconoce sin su propio hex) son: blue, red, green, orange, purple, teal. */
.hl-blue{color:var(--info);font-weight:600}
.hl-red{color:var(--bad);font-weight:600}
.hl-green{color:var(--good);font-weight:600}
.hl-orange{color:var(--amber);font-weight:600}
.hl-purple{color:var(--hl-purple);font-weight:600}
.hl-teal{color:var(--accent);font-weight:600}
mjx-container svg [fill="blue"]{fill:var(--info)!important;stroke:var(--info)!important}
mjx-container svg [fill="red"]{fill:var(--bad)!important;stroke:var(--bad)!important}
mjx-container svg [fill="green"]{fill:var(--good)!important;stroke:var(--good)!important}
mjx-container svg [fill="orange"]{fill:var(--amber)!important;stroke:var(--amber)!important}
mjx-container svg [fill="purple"]{fill:var(--hl-purple)!important;stroke:var(--hl-purple)!important}
mjx-container svg [fill="teal"]{fill:var(--accent)!important;stroke:var(--accent)!important}
.fig > svg{display:block;margin:0 auto;width:min(100%, 640px);height:auto}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:9px;text-align:center;max-width:640px;margin-inline:auto}
/* autodiagramas generados cuando el ejercicio no trae figura propia */
/* Paleta fija para los autodiagramas: el recuadro ".fig" es siempre casi blanco
   (TikZ exportado asi), independientemente del tema claro/oscuro del sitio, asi que
   estos colores se fijan en vez de usar las variables --accent/--muted/--line (que en
   modo oscuro se vuelven grises claros y casi desaparecen sobre fondo blanco: eso era
   el motivo de que la cuadricula de coordenadas se viera "lavada"/fea).
   Familia teal + ambar (segura para daltonismo, tipo azul/naranja de Okabe-Ito),
   con un tercer acento ciruela solo para una 3a serie si hiciera falta. */
.adg-grid{stroke:#e8e3d8;stroke-width:1}
.adg-axis{stroke:#24312c;stroke-width:1.6}
.adg-axislabel{fill:#5c6b67;font-size:12.5px;font-style:italic;font-family:var(--sans)}
.adg-tick{fill:#6b7b74;font-size:10.5px;font-family:var(--mono)}
.adg-pt{fill:#0e7a68;stroke:#fbfcfd;stroke-width:2}
.adg-pt2{fill:#c17a17;stroke:#fbfcfd;stroke-width:2}
.adg-ptlabel{fill:#20302a;font-size:12px;font-weight:600;font-family:var(--mono);paint-order:stroke;stroke:#fbfcfd;stroke-width:3px;stroke-linejoin:round}
.adg-line{stroke:#0e7a68;stroke-width:1.6;stroke-linecap:round}
.adg-line2{stroke:#c17a17;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:7,4}
.adg-tri{fill:#d9efe8;stroke:#0e7a68;stroke-width:1.8}
.adg-tri2{fill:#fbe8cf;stroke:#c17a17;stroke-width:1.8}
.adg-vlabel{fill:#20302a;font-size:14px;font-weight:700;font-family:var(--sans)}
.adg-sidelabel{fill:#5c6b67;font-size:11.5px;font-weight:600;font-family:var(--mono);paint-order:stroke;stroke:#fbfcfd;stroke-width:3px;stroke-linejoin:round}
.adg-rightangle{fill:none;stroke:#0e7a68;stroke-width:1.6}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container svg{max-width:100%}
.mdquote{margin:14px 0;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.mdquote p{margin:6px 0}
.mdh{margin:14px 0 6px;font-size:16px}
.mdquote .mdh{margin-top:4px}
.footnote{color:var(--muted);font-size:12.5px;margin-top:34px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:480px){ h1{font-size:22px} .face{font-size:15.5px;padding:20px} }
/* Pantalla de contraseña (contenido cifrado en cifrado/) */
.lock{max-width:380px;margin:56px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.lock h1{margin:0 0 6px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.lock input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lock input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.lock label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:12px 0 16px;cursor:pointer}
.lock .btn{width:100%;background:var(--accent);border-color:var(--accent);color:#fff}
.lock .btn:hover{color:#fff;filter:brightness(1.08)}
.lock .btn:disabled{opacity:.6;cursor:wait}
.lock-err{color:var(--bad);font-size:13.5px;min-height:1.2em;margin-top:10px}
.lockout{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.lockout:hover{color:var(--accent)}
</style>
</head>
<body>


<header class="app"><div class="appbar">
  <span class="brand" id="brand" tabindex="0" role="link">Nebula Cursos</span>
  <nav class="crumbs" id="crumbs"></nav>
</div></header>
<main class="wrap" id="main"><div class="loading">Cargando catálogo…</div></main>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']], processEscapes: true,
    /* \pounds no esta en los paquetes base/ams de MathJax: sin esto aparece en rojo como texto literal */
    macros: { pounds: '\\text{£}' }
  },
  svg: { fontCache: 'global' },
  /* extensiones que MathJax carga bajo demanda (\cancel, \boldsymbol, \ce...): van en mathjax-ext/.
     Sin esto, una sola de esas macros hace fallar el renderizado de TODA la pestaña. */
  loader: { paths: { tex: './mathjax-ext' } },
  options: { enableMenu: false }
};
</script>
<script src="mathjax-tex-svg.min.js"></script>
<script>
'use strict';
const $main = document.getElementById('main');
const $crumbs = document.getElementById('crumbs');
let CAT = null;
let LANG = 'es';
const BUNDLES = {};

/* ---------- utilidades ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* markdown ligero que respeta $...$ */
function mdTable(lines){
  const sep = lines[1].trim().replace(/^\|/,'').replace(/\|$/,'');
  if (!/^[\s:|-]+$/.test(sep)) return null;
  const cells = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
  const head = cells(lines[0]);
  const rows = lines.slice(2).map(cells);
  return '<div class="kwwrap"><table class="mdtable"><thead><tr>' + head.map(c => `<th>${c}</th>`).join('') +
    '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
}
/* algun contenido trae tablas en LaTeX crudo (\begin{tabular}...\end{tabular},
   a veces envueltas en \begin{center}...\end{center}) en vez de markdown: eran para
   el PDF, pero en la web, sin esto, MathJax las intenta "leer" como formula y falla
   con "Unknown environment 'center'" (visible en pantalla como error en rojo). Aqui
   se detectan y se convierten a una tabla HTML normal, con el mismo estilo que las
   tablas en markdown (mdTable), ANTES de que el texto llegue a la proteccion de $...$. */
function texTableToHtml(body){
  let rows = body.replace(/\\(?:top|mid|bottom)rule|\\hline/g, '').split('\\\\').map(r => r.trim()).filter(Boolean);
  if (rows.length < 2) return null;
  const cellsOf = r => r.split('&').map(c => c.trim());
  const head = cellsOf(rows[0]);
  const bodyRows = rows.slice(1).map(cellsOf);
  if (bodyRows.some(r => r.length !== head.length)) return null;
  return '<div class="kwwrap"><table class="mdtable"><thead><tr>' +
    head.map(c => `<th>${mdi(c)}</th>`).join('') +
    '</tr></thead><tbody>' +
    bodyRows.map(r => '<tr>' + r.map(c => `<td>${mdi(c)}</td>`).join('') + '</tr>').join('') +
    '</tbody></table></div>';

function stripLatexTables(s){
  const tables = [];
  const stash = html => { tables.push(html); return '\u0003' + (tables.length-1) + '\u0003'; };
  s = s.replace(/\\begin\{center\}\s*\\begin\{tabular\}\{[^}]*\}([\s\S]*?)\\end\{tabular\}\s*\\end\{center\}/g,
    (full, body) => { const t = texTableToHtml(body); return t ? stash(t) : full; });
  s = s.replace(/\\begin\{tabular\}\{[^}]*\}([\s\S]*?)\\end\{tabular\}/g,
    (full, body) => { const t = texTableToHtml(body); return t ? stash(t) : full; });
  return { s, tables };
}
/* separa en parrafos/listas texto largo que llega del JSON como un unico bloque sin saltos de linea */
function autosplit(s){
  if (s == null) return s;
  s = String(s);
  if (s.indexOf('\n') !== -1) return s;
  if (s.length < 260) return s;
  const math = [];
  let t = s.replace(/\$\$(?:\\.|[\s\S])+?\$\$|\$(?:\\.|[^$\n])+\$/g, m => { math.push(m); return '\u0002' + (math.length-1) + '\u0002'; });
  if (/^\s*1[.)]\s/.test(t)){
    const parts = t.split(/\s+(?=\d{1,2}[.)]\s)/);
    if (parts.length >= 2) t = parts.join('\n');
  } else {
    const abbrRe = /\b(e\.g|i\.e|etc|vs|approx|fig|eq|no|cf)\.$/i;
    const boundary = /[.?!]+(?=\s+[A-ZÁÉÍÓÚÑ0-9\u0002])/g;
    const sentences = [];
    let last = 0, m;
    while ((m = boundary.exec(t))){
      const end = m.index + m[0].length;
      const piece = t.slice(last, end).trim();
      if (abbrRe.test(piece)) continue;
      if (piece) sentences.push(piece);
      last = end;
    }
    const tail = t.slice(last).trim();
    if (tail) sentences.push(tail);
    if (sentences.length > 1){
      const paras = [];
      let cur = '';
      for (const sent of sentences){
        if (cur && (cur.length + sent.length + 1 > 200)){ paras.push(cur); cur = sent; }
        else cur = cur ? cur + ' ' + sent : sent;
      }
      if (cur) paras.push(cur);
      t = paras.join('\n\n');
    }
  }
  t = t.replace(/\u0002(\d+)\u0002/g, (_,i) => math[+i]);
  return t;
}
/* separa en parrafos cada apartado (a)/(b)/(c)... o (i)/(ii)/(iii)... de un
   enunciado o respuesta que los trae todos pegados en una sola frase sin
   saltos de linea; nunca parte dentro de una formula $...$. Si el texto ya
   trae sus propios parrafos (doble salto de linea), no se toca. */
/* "\$" (barra+dolar) es la forma de LaTeX de imprimir un simbolo $ literal
   (p.ej. precios: "$-\$35$" o fuera de modo matematico "A\$37.50"). El
   regex que empareja pares $...$/$$...$$ no sabe que esa barra la protege,
   asi que puede emparejar por error ese $ con el de OTRO precio/formula mas
   adelante en el mismo texto y tragarse frases enteras como si fueran una
   sola formula (eso es lo que se ve como "codigo LaTeX colandose"). Por eso
   se protege "\$" ANTES de cualquier busqueda de $...$, y se restaura al
   final como un simple caracter $. */
function protectDollarEscape(s){
  if (s == null) return s;
  return String(s).replace(/\\\$/g, '\u0006');
}
function restoreDollarEscape(s){
  if (s == null) return s;
  /* se devuelve como "\$" y no como "$" pelado: dentro de una formula ("$\$35$") es el comando TeX
     del simbolo dolar, y fuera de ella MathJax (processEscapes) lo muestra como "$" sin riesgo de que
     dos precios de la misma frase se emparejen como si fueran los delimitadores de una formula. */
  return String(s).replace(/\u0006/g, '\\$');
}
function splitLetteredParts(s){
  if (s == null) return s;
  s = String(s);
  if (/\n\s*\n/.test(s)) return s;
  const math = [];
  let t = s.replace(/\$\$(?:\\.|[\s\S])+?\$\$|\$(?:\\.|[^$\n])+\$/g, m => { math.push(m); return '\u0005' + (math.length-1) + '\u0005'; });
  const MARK_RE = /\(([a-j]|i{1,3}|iv|vi{0,3}|ix|x)\)/g;
  const idxs = [];
  let m;
  while ((m = MARK_RE.exec(t))) idxs.push(m.index);
  if (idxs.length >= 2){
    let out = '', last = 0;
    for (const idx of idxs){
      out += t.slice(last, idx);
      if (idx > 0) out += '\n\n';
      last = idx;
    }
    out += t.slice(last);
    t = out;
  }
  return t.replace(/\u0005(\d+)\u0005/g, (_,i) => math[+i]);
}
function md(s){
  if (s == null) return '';

  s = splitLetteredParts(s);

  s = String(s);
  const latexTables = stripLatexTables(s);
  s = latexTables.s;
  const math = [];
  s = s.replace(/\$\$(?:\\.|[\s\S])+?\$\$|\$(?:\\.|[^$\n])+\$/g, m => { math.push(m); return '\u0001' + (math.length-1) + '\u0001'; });
  /* comandos de espaciado/escape de LaTeX (\,  \;  \!  \:  \%  \&  \_  \#) que el contenido deja
     fuera de los $...$ por error: sin esto aparecen como texto crudo tipo "6\,cm" */
  s = s.replace(/\\([,;!:%&_#])/g, (_, c) => (',;!:'.includes(c) ? ' ' : c));
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  /* resaltado de color en prosa: [[blue:texto]] -> <span class="hl-blue">texto</span>; misma paleta que \color{} en LaTeX */
  s = s.replace(/\[\[(blue|red|green|orange|purple|teal):([^\]]+)\]\]/g, '<span class="hl-$1">$2</span>');
  /* un parrafo: tabla, lista, titulo (### ...) o texto normal */
  function para(p){
    const lines = p.split('\n').filter(l => l.trim().length);
    if (!lines.length) return '';
    if (lines.length >= 2 && lines.every(l => /^\s*\|.*\|\s*$/.test(l))){
      const t = mdTable(lines);
      if (t) return t;
    }
    if (lines.length > 1 && lines.every(l => /^\s*[-•]\s+/.test(l)))
      return '<ul>' + lines.map(l => '<li>' + l.replace(/^\s*[-•]\s+/,'') + '</li>').join('') + '</ul>';
    if (lines.length > 1 && lines.every(l => /^\s*\d+[.)]\s+/.test(l)))
      return '<ol>' + lines.map(l => '<li>' + l.replace(/^\s*\d+[.)]\s+/,'') + '</li>').join('') + '</ol>';
    /* titulos markdown (#, ##, ###): antes se veian como "###" literal */
    if (/^\s*#{1,4}\s+/.test(lines[0])){
      const head = '<h4 class="mdh">' + lines[0].replace(/^\s*#{1,4}\s+/,'') + '</h4>';
      return lines.length > 1 ? head + para(lines.slice(1).join('\n')) : head;
    }

  }
  const paras = s.split(/\n{2,}/).map(p => {

    const ls = p.split('\n').filter(l => l.trim().length);
    if (ls.length && ls.every(l => /^\s*&gt;/.test(l)))
      return '<blockquote class="mdquote">' + para(ls.map(l => l.replace(/^\s*&gt;\s?/,'')).join('\n')) + '</blockquote>';
    return para(p);

  s = s.replace(/\u0001(\d+)\u0001/g, (_,i) => esc(math[+i]).replace(/&amp;/g,'&'));
  s = s.replace(/\u0003(\d+)\u0003/g, (_,i) => latexTables.tables[+i]);

}

  return md(s).replace(/<\/p>\s*<p>/g,'<br><br>').replace(/^<p>/,'').replace(/<\/p>$/,'');

/* ---------- navegación por hash: home | c-<i> | u-<i>-<j> | l-<i>-<j>-<k>[-tab] ---------- */
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);
document.getElementById('brand').addEventListener('click', () => go(''));
document.getElementById('brand').addEventListener('keydown', e => { if (e.key==='Enter') go(''); });

function setCrumbs(parts){
  $crumbs.innerHTML = parts.map((p,i) =>
    (i ? '<span class="sep">›</span>' : '') +
    (p.href != null ? `<a href="#${p.href}">${esc(p.label)}</a>` : `<a>${esc(p.label)}</a>`)
  ).join('');
}

function parseHash(){
  const m = (location.hash || '').replace(/^#/,'');
  const p = m.split('-');
  if (p[0]==='c' && CAT.projects[+p[1]]) return {v:'course', i:+p[1]};
  if (p[0]==='u' && CAT.projects[+p[1]]?.units[+p[2]]) return {v:'unit', i:+p[1], j:+p[2]};
  if (p[0]==='l' && CAT.projects[+p[1]]?.units[+p[2]]?.lecciones[+p[3]]) return {v:'lesson', i:+p[1], j:+p[2], k:+p[3], tab:p[4]||'teoria'};
  return {v:'home'};
}

function render(){
  if (!CAT) return;
  const st = parseHash();
  window.scrollTo(0,0);
  if (st.v==='home') return renderHome();
  if (st.v==='course') return renderCourse(st.i);
  if (st.v==='unit') return renderUnit(st.i, st.j);
  return renderLesson(st.i, st.j, st.k, st.tab);
}

   trae fichas, test, teoria, vocabulario o repaso, ese boton ni siquiera debe
   aparecer (en vez de aparecer y mostrar "vacio"). */
function tabContentFlags(d){
  return {
    teoria: !!(d.objectives?.length || d.theory_blocks?.length || d.summary?.big_idea ||
      d.summary?.key_points?.length || d.summary?.formulas?.length || d.summary?.what_to_remember_if_nothing_else),

}

async function renderLesson(i,j,k,tab){
  const p = CAT.projects[i], u = p.units[j], l = u.lecciones[k];
  setCrumbs([{label:'Inicio', href:''},{label:p.label, href:`c-${i}`},{label:pretty(u.titulo||u.id), href:`u-${i}-${j}`},{label:l.titulo}]);
  let data = BUNDLES[l.bundle]?.[l.bkey];
  if (!data){
    $main.innerHTML = '<div class="loading">Cargando lección…</div>';
    try{
      if (!BUNDLES[l.bundle]) BUNDLES[l.bundle] = await loadJSON(l.bundle);
      data = BUNDLES[l.bundle][l.bkey];
    }catch(e){
      $main.innerHTML = '<div class="empty">No se pudo cargar esta lección. Comprueba la conexión y vuelve a intentarlo.</div>';
      return;
    }
  }
  if (!data){ $main.innerHTML = '<div class="empty">Lección no encontrada en el paquete.</div>'; return; }
  LANG = data.lang === 'en' ? 'en' : 'es';

  const flags = tabContentFlags(data);
  let availTabs = TABS.filter(([id]) => flags[id]);
  if (!availTabs.length) availTabs = [TABS[0]]; // salvaguarda: nunca dejar la vista totalmente en blanco
  const effTab = flags[tab] ? tab : availTabs[0][0];

  let out = `<h1>${esc(data.title || l.titulo)}</h1>
    <p class="sub">${esc(data.course_label || p.label)} · <span class="dots">${dots(l.dificultad)}</span> ${esc(l.duracion||'')}</p>
    <div class="tabs">` +
    availTabs.map(([id,lab]) => `<button class="${id===effTab?'on':''}" data-go="l-${i}-${j}-${k}-${id}">${lab}</button>`).join('') +
    `</div><div id="tabbody"></div>`;
  $main.innerHTML = out;
  bindGo();
  const body = document.getElementById('tabbody');
  if (effTab==='fichas') viewFichas(body, data);
  else if (effTab==='test') viewTest(body, data);
  else if (effTab==='ejercicios') viewEjercicios(body, data);
  else if (effTab==='vocab') body.innerHTML = viewVocab(data);
  else if (effTab==='repaso') body.innerHTML = viewRepaso(data);
  else body.innerHTML = viewTeoria(data);
  typeset();
}

    const formula = b.formula ? theoryFormula(b.formula) : '';
    out += `<div class="block t-${esc(type)}"><span class="tag">${label}${b.scope && b.scope!=='CORE' ? ' · '+esc(b.scope):''}</span>
      <h3>${mdi(b.title||'')}</h3>${md(b.body)}${formula}${assetsHtml(b.assets)}${conceptIllustration(b, uid, seenChartKinds)}${geometryIllustration(b, uid)}${mensurationIllustration(b, uid, seenChartKinds)}${geoTrigIllustration(b, uid, seenChartKinds)}${algebraGraphIllustration(b, uid, seenChartKinds)}${transformVectorIllustration(b, uid, seenChartKinds)}</div>`;
  });
  if (s){
    out += `<div class="block"><span class="tag">${t('resumen')}</span>`;
    if (s.key_points?.length) out += `<ul>` + s.key_points.map(x => `<li>${mdi(str(x))}</li>`).join('') + '</ul>';
    if (s.formulas?.length) out += `<p><strong>${t('formulas')}</strong></p>` + s.formulas.map(x => `<div class="formula-row">${mdi(texDisplay(x))}</div>`).join('');
    if (s.what_to_remember_if_nothing_else) out += `<p><strong>${t('solo_recuerda')}</strong> ${mdi(str(s.what_to_remember_if_nothing_else))}</p>`;
    if (s.exit_check?.question) out += `<div class="q"><div class="stem"><strong>${t('comprueba')}</strong> ${mdi(s.exit_check.question)}</div>` + (s.exit_check.answer ? det(t('ver_respuesta'), md(s.exit_check.answer)) : '') + '</div>';
    out += '</div>';
  }
  return out || `<div class="empty">${t('sin_teoria')}</div>`;
}
/* algunos campos llegan como texto suelto en vez de lista: se normalizan para no romper la pestaña */
function asList(x){ return Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]); }
function str(x){ if (x==null) return ''; if (typeof x==='string') return x; if (Array.isArray(x)) return x.map(str).join(' · '); if (typeof x==='object') return Object.values(x).map(str).join(' — '); return String(x); }

/* --- Fichas (flashcards) --- */
function viewFichas(el, d){
  const cards = d.flashcards || [];
  if (!cards.length){ el.innerHTML = `<div class="empty">${t('sin_fichas')}</div>`; return; }
  let order = cards.map((_,x)=>x), pos = 0, flipped = false;
  el.innerHTML = `<div class="fcstage">
    <div class="fcounter" id="fcount"></div>
    <div class="fcard" id="fcard" tabindex="0" role="button" aria-label="Pulsar para girar la ficha">
      <div class="fcin">
        <div class="face front"><span class="lbl" id="fkind"></span><div id="ffront"></div></div>
        <div class="face back"><span class="lbl" id="fbacklbl"></span><div id="fback"></div></div>
      </div></div>
    <div class="fbtns">
      <button class="btn" id="fprev">← Anterior</button>
      <button class="btn" id="fflip">Girar</button>
      <button class="btn" id="fnext">Siguiente →</button>
      <button class="btn" id="fshuf">Barajar</button>
    </div></div>`;
  const $c = el.querySelector('#fcard');
  function paint(){
    const c = cards[order[pos]];
    flipped = false; $c.classList.remove('flip');
    el.querySelector('#fcount').textContent = (pos+1) + ' / ' + cards.length;
    el.querySelector('#fkind').textContent = (FCARD_LABEL[c.kind] && (FCARD_LABEL[c.kind][LANG]||FCARD_LABEL[c.kind].es)) || c.kind || 'ficha';
    el.querySelector('#fbacklbl').textContent = t('respuesta_lbl');
    el.querySelector('#ffront').innerHTML = md(c.front);
    el.querySelector('#fback').innerHTML = md(c.back);
    typeset();
  }
  function flip(){ flipped = !flipped; $c.classList.toggle('flip', flipped); }
  $c.addEventListener('click', flip);
  $c.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); flip(); } });
  el.querySelector('#fflip').addEventListener('click', flip);
  el.querySelector('#fnext').addEventListener('click', () => { pos = (pos+1)%order.length; paint(); });
  el.querySelector('#fprev').addEventListener('click', () => { pos = (pos-1+order.length)%order.length; paint(); });
  el.querySelector('#fshuf').addEventListener('click', () => {
    for (let x=order.length-1;x>0;x--){ const y = Math.floor(Math.random()*(x+1)); [order[x],order[y]]=[order[y],order[x]]; }
    pos = 0; paint();
  });
  paint();
}

/* --- Test (MCQ) --- */
function viewTest(el, d){
  const qs = d.mcq || [];
  if (!qs.length){ el.innerHTML = `<div class="empty">${t('sin_test')}</div>`; return; }
  el.innerHTML = qs.map((q,qi) => `<div class="q" data-q="${qi}">
      <div class="stem">${qi+1}. ${mdi(q.stem)}</div>
      <div class="opts">` +
      (q.options||[]).map(o => `<button class="opt" data-k="${esc(o.key)}"><span class="k">${esc(o.key)})</span><span>${mdi(o.text)}</span></button>`).join('') +
      `</div><div class="vslot"></div></div>`).join('');
  el.querySelectorAll('.q').forEach(qel => {
    const q = qs[+qel.dataset.q];
    qel.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      if (qel.dataset.done) return;
      qel.dataset.done = '1';
      const pick = btn.dataset.k, ok = pick === q.correct;
      qel.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if (b.dataset.k === q.correct) b.classList.add('ok');
        else if (b === btn) b.classList.add('ko');
      });
      const opt = (q.options||[]).find(o => o.key === pick);
      const vs = qel.querySelector('.vslot');
      vs.innerHTML = ok
        ? `<div class="verdict ok"><strong>${t('correcto')}</strong> ${mdi(q.explanation||'')}</div>`
        : `<div class="verdict ko"><strong>${t('no')}</strong> ${mdi(opt?.why_wrong||'')}<br><strong>${t('respuesta_colon')} ${esc(q.correct)}.</strong> ${mdi(q.explanation||'')}</div>`;
      typeset();
    }));
  });
}

/* --- Ejercicios --- */
function buildConceptMap(keywords){
  const map = {};
  (keywords||[]).forEach(k => {
    if (!k || !k.concept_id) return;
    (map[k.concept_id] = map[k.concept_id] || []).push(k);
  });
  return map;
}
function conceptHint(conceptMap, conceptIds){
  if (!conceptMap || !conceptIds || !conceptIds.length) return '';
  const seen = new Set(); const items = [];
  for (const cid of conceptIds){
    const arr = conceptMap[cid];
    if (!arr || !arr.length) continue;
    const k = arr[0];
    if (!k.term || seen.has(k.term)) continue;
    seen.add(k.term);
    items.push(k);
    if (items.length >= 2) break;
  }
  if (!items.length) return '';
  const body = items.map(k => `${mdi(k.term)}: ${mdi(k.definition||'')}`).join(' &middot; ');
  return `<div class="callout info concept-hint"><strong>${t('idea_clave')}</strong> ${body}</div>`;
}
/* --- pasos de solucion: separa un full_solution denso en micro-pasos numerados
   para que el alumno pueda seguir el razonamiento en vez de recibir un bloque
   unico de operaciones encadenadas. Protege los tramos de matematicas ($...$)
   para no partir nunca dentro de una formula. --- */
function splitSolutionSteps(text){
  if (!text) return [];
  text = protectDollarEscape(text);
  const MATH_RE = /\$\$(?:\\.|[\s\S])+?\$\$|\$(?:\\.|[^$\n])+\$/g;
  const placeholders = [];
  const protectedText = text.replace(MATH_RE, m => { placeholders.push(m); return `\u0002${placeholders.length-1}\u0002`; });
  const ABBR_RE = /\b(e\.g|i\.e|etc|vs|approx|fig|eq|no|cf|dr|sr|sra)\.$/i;
  const tokens = protectedText.split(/([.;])(\s+)/);
  const parts = []; let buf = '';
  for (let i = 0; i < tokens.length; i += 3){
    buf += (tokens[i] || '');
    const punct = tokens[i+1];
    if (punct){
      buf += punct;
      if (punct === '.' && ABBR_RE.test(buf.trim())){ buf += (tokens[i+2] || ' '); continue; }
      parts.push(buf.trim());
      buf = '';
    }
  }
  if (buf.trim()) parts.push(buf.trim());
  const restore = s => s.replace(/\u0002(\d+)\u0002/g, (_, n) => placeholders[+n]);
  return parts.map(restore).filter(Boolean);
}
function renderSolutionSteps(text){
  const steps = splitSolutionSteps(text);
  if (steps.length <= 1) return `<p>${mdi(text)}</p>`;
  return `<div class="sol-flow">` + steps.map((s,i) =>
    `<p${i===steps.length-1 ? ' class="final"' : ''}>${mdi(s)}</p>`
  ).join('') + `</div>`;
}
function exBlock(e, extra, unitId, conceptMap){
  let out = `<div class="q">`;
  if (extra) out += extra(e);
  if (e.title) out += `<h3 class="qtitle">${mdi(e.title)}</h3>`;
  out += `<div class="stem">${md(e.statement)}</div>`;
  if (e.knowns?.length || e.unknowns?.length){
    out += '<div class="kw-setup">';
    if (e.knowns?.length) out += `<p><strong>${t('datos')}</strong> ${e.knowns.map(x=>mdi(str(x))).join('; ')}</p>`;
    if (e.unknowns?.length) out += `<p><strong>${t('incognita')}</strong> ${e.unknowns.map(x=>mdi(str(x))).join('; ')}</p>`;
    out += '</div>';
  }
  out += assetsHtml(e.assets) || autoDiagram(e, unitId) || autoChart(e, unitId);
  if (e.hints?.length) out += det(t('pistas'), '<ul>'+e.hints.map(x=>`<li>${mdi(x)}</li>`).join('')+'</ul>');
  let sol = '';
  if (!e.reasoning?.length && !e.steps?.length) sol += conceptHint(conceptMap, e.concept_ids);
  if (e.reasoning?.length) sol += '<div class="sol-flow">'+e.reasoning.map((x,i,a)=>`<p${i===a.length-1?' class="final"':''}>${mdi(x)}</p>`).join('')+'</div>';
  if (e.steps?.length) sol += '<div class="sol-flow">'+e.steps.map((x,i,a)=>`<p${i===a.length-1?' class="final"':''}><strong>Paso ${i+1}.</strong> ${mdi(str(x))}</p>`).join('')+'</div>';
  if (e.answer) sol += `<p><strong>${t('respuesta')}</strong> ${mdi(e.answer)}</p>`;
  if (e.solution && !e.reasoning?.length) sol += md(e.solution);
  if (e.full_solution && !e.steps?.length) sol += renderSolutionSteps(e.full_solution);
  if (e.verification) sol += `<div class="callout info"><strong>Comprobación.</strong> ${mdi(e.verification)}</div>`;
  if (e.interpretation) sol += `<div class="callout info"><strong>${t('por_que_funciona')}</strong> ${mdi(e.interpretation)}</div>`;
  if (e.common_mistake) sol += `<div class="callout warn"><strong>${t('error_tipico')}</strong> ${mdi(e.common_mistake)}</div>`;
  if (e.common_errors?.length) sol += `<div class="callout warn"><strong>${t('errores_tipicos')}</strong><ul>` + e.common_errors.map(x=>`<li>${mdi(str(x))}</li>`).join('') + '</ul></div>';
  if (e.mark_scheme) sol += `<p><strong>${t('criterios')}</strong></p>` + (Array.isArray(e.mark_scheme) ? '<ul>'+e.mark_scheme.map(x=>`<li>${mdi(str(x))}</li>`).join('')+'</ul>' : md(str(e.mark_scheme)));
  if (sol) out += det(t('ver_solucion'), sol);
  return out + '</div>';
}
function det(label, inner){ return `<details><summary>${label}</summary><div class="inner">${inner}</div></details>`; }
/* Los SVG compilados desde TikZ (dvisvgm) usan ids de glifo genericos
   (glyph-0-0, glyph-1-0...) que NO son unicos entre figuras distintas. Si dos
   de estas figuras se insertan en la misma pagina, el navegador resuelve cada
   <use href="#glyph-0-0"> contra el PRIMER elemento con ese id en todo el
   documento, mezclando los glifos de una figura con los de otra y produciendo
   texto ilegible/solapado. Se renombra cada id con un sufijo unico por figura
   antes de insertarla, y se actualizan sus referencias (href="#id", url(#id)). */
let __svgAssetSeq = 0;
function namespaceSvgIds(svg){
  if (!svg || typeof svg !== 'string') return svg;
  const uid = 'a' + (__svgAssetSeq++);
  const ids = [];
  svg = svg.replace(/\bid="([^"]+)"/g, (m, id) => { ids.push(id); return `id="${id}-${uid}"`; });
  if (!ids.length) return svg;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const idPattern = new RegExp('#(' + ids.map(esc).join('|') + ')(?=["\\)])', 'g');
  return svg.replace(idPattern, (m, id) => `#${id}-${uid}`);
}
function assetsHtml(assets){
  if (!assets || !assets.length) return '';
  let out = '';
  for (const a of assets){
    if (!a || typeof a !== 'object' || !a.svg) continue;
    out += `<figure class="fig">${namespaceSvgIds(a.svg)}${a.caption ? `<figcaption>${mdi(a.caption)}</figcaption>` : ''}</figure>`;
  }
  return out;
}

/* --- autodiagramas: cuando un ejercicio no trae figura propia pero el enunciado
   describe algo dibujable (puntos/rectas en el plano, un triangulo concreto), se
   genera un esquema simple en SVG. Nunca rompe el render: cualquier fallo se ignora. --- */
function wrapFig(svg, caption){
  if (!svg) return '';
  return `<figure class="fig">${svg}${caption ? `<figcaption>${esc(caption)}</figcaption>` : ''}</figure>`;
}
function numToStr(v){ const r = Math.round(v*100)/100; return (Object.is(r,-0)?0:r).toString(); }
function niceStep(span){
  /* paso de cuadricula "bonito" pero nunca menor que 1: los ejercicios usan
     coordenadas enteras, asi que una cuadricula de 0.5 confundiria al alumno */
  if (!isFinite(span) || span <= 0) return 1;
  const candidates = [1,2,5,10,20,25,50,100,200,500];
  const target = span / 6;
  for (const c of candidates) if (c >= target) return c;
  return candidates[candidates.length - 1];
}
function svgCoordPlane(pts, lines, xMin, xMax, yMin, yMax, xStep, yStep, xDom, connect){
  const size = 320, pad = 32;
  const spanX = size - 2*pad, spanY = size - 2*pad;
  const sx = v => pad + (v-xMin)/(xMax-xMin)*spanX;
  const sy = v => pad + (yMax-v)/(yMax-yMin)*spanY;
  const axisX = (xMin <= 0 && 0 <= xMax) ? sx(0) : (xMin > 0 ? pad : size-pad);
  const axisY = (yMin <= 0 && 0 <= yMax) ? sy(0) : (yMin > 0 ? size-pad : pad);
  const defs = `<defs>
    <marker id="adg-ax-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#24312c"/></marker>
    <marker id="adg-l1-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0e7a68"/></marker>
    <marker id="adg-l1-arrow-s" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0e7a68"/></marker>
    <marker id="adg-l2-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c17a17"/></marker>
    <marker id="adg-l2-arrow-s" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c17a17"/></marker>
  </defs>`;
  let grid = '', ticks = '';
  const xStart = Math.ceil(xMin/xStep)*xStep, yStart = Math.ceil(yMin/yStep)*yStep;
  for (let k = xStart; k <= xMax + 1e-9; k += xStep){
    const kk = Math.abs(k) < xStep*1e-6 ? 0 : k;
    grid += `<line x1="${sx(kk)}" y1="${pad}" x2="${sx(kk)}" y2="${size-pad}" class="adg-grid"/>`;
    if (kk !== 0) ticks += `<text x="${sx(kk)}" y="${Math.min(axisY+16, size-6)}" class="adg-tick" text-anchor="middle">${numToStr(kk)}</text>`;
  }
  for (let k = yStart; k <= yMax + 1e-9; k += yStep){
    const kk = Math.abs(k) < yStep*1e-6 ? 0 : k;
    grid += `<line x1="${pad}" y1="${sy(kk)}" x2="${size-pad}" y2="${sy(kk)}" class="adg-grid"/>`;
    if (kk !== 0) ticks += `<text x="${Math.max(axisX-7, pad+14)}" y="${sy(kk)+3}" class="adg-tick" text-anchor="end">${numToStr(kk)}</text>`;
  }
  let axes = `<line x1="${pad}" y1="${axisY}" x2="${size-pad}" y2="${axisY}" class="adg-axis" marker-end="url(#adg-ax-arrow)"/>`;
  axes += `<line x1="${axisX}" y1="${size-pad}" x2="${axisX}" y2="${pad}" class="adg-axis" marker-end="url(#adg-ax-arrow)"/>`;
  axes += `<text x="${size-pad-6}" y="${axisY-8}" class="adg-axislabel">x</text>`;
  axes += `<text x="${axisX+8}" y="${pad+6}" class="adg-axislabel">y</text>`;
  /* el dominio en x de una recta puede llevar su y fuera de [yMin,yMax] (p.ej.
     una recta con pendiente grande): se recorta al tramo donde la recta cae
     dentro del rectangulo visible para que nunca se salga del grafico. */
  function clippedLineDom(m, c, x1, x2){
    if (x2 <= x1) return null;
    if (!isFinite(m) || !isFinite(c)) return null;
    if (m === 0) return (c >= yMin && c <= yMax) ? [x1, x2] : null;
    const xAtYMin = (yMin - c) / m, xAtYMax = (yMax - c) / m;
    const loX = Math.min(xAtYMin, xAtYMax), hiX = Math.max(xAtYMin, xAtYMax);
    const lo = Math.max(x1, loX), hi = Math.min(x2, hiX);
    return (hi > lo) ? [lo, hi] : null;
  }
  let lineSvg = '';
  (lines||[]).forEach((L,i) => {
    const ownDom = L.dom ? [Math.max(xMin, L.dom[0]), Math.min(xMax, L.dom[1])] : null;
    const dom = ownDom || (xDom ? [Math.max(xMin, xDom[0]), Math.min(xMax, xDom[1])] : [xMin, xMax]);
    const clipped = clippedLineDom(L.m, L.c, dom[0], dom[1]);
    if (!clipped) return;
    const x1 = clipped[0], x2 = clipped[1];
    const y1 = L.m*x1+L.c, y2 = L.m*x2+L.c;
    const cls = i===0 ? 'adg-line' : 'adg-line2';
    /* las flechas solo corresponden a los ejes: una recta/segmento dibujado
       nunca lleva punta de flecha, la pida o no el llamador. */
    if (isFinite(y1) && isFinite(y2) && x2 > x1) lineSvg += `<line x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}" class="${cls}"/>`;
  });
  let curveSvg = '';
  if (connect && pts.length >= 3){
    const d = pts.map(([x,y], i) => `${i===0?'M':'L'}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(' ');
    curveSvg = `<path d="${d}" fill="none" class="adg-line"/>`;
  }
  /* con muchas curvas de puntos unidos (frecuencia acumulada) las etiquetas
     "(x, y)" en cada punto solo sobrecargan el dibujo: con 5+ puntos se omiten
     y basta la cuadricula para leer el valor. */
  const showLabels = !(connect && pts.length >= 5);
  /* evita que las etiquetas "(x, y)" se solapen cuando dos puntos quedan cerca:
     se prueban varias posiciones (arriba, abajo, mas arriba, mas abajo) y se
     elige la primera que no choque con ninguna etiqueta ya colocada; si ninguna
     es perfecta, se usa la menos mala (la que menos se solapa) en vez de romper
     el dibujo. Estimacion de ancho en caracteres (fuente monoespaciada). */
  const CHAR_W = 7.1, LABEL_H = 13;
  const placedBoxes = [];
  function boxOverlap(a, b){
    const padBx = 1.5;
    return a.x0 < b.x1+padBx && a.x1 > b.x0-padBx && a.y0 < b.y1+padBx && a.y1 > b.y0-padBx;
  }
  function overlapArea(a, b){
    const ox = Math.max(0, Math.min(a.x1,b.x1) - Math.max(a.x0,b.x0));
    const oy = Math.max(0, Math.min(a.y1,b.y1) - Math.max(a.y0,b.y0));
    return ox*oy;
  }
  function placeLabel(cx, cy, text, preferAbove){
    const w = text.length * CHAR_W;
    /* ademas de arriba/abajo centrado, se prueban variantes desplazadas en
       diagonal (arriba-derecha, arriba-izquierda, abajo-derecha, abajo-izquierda)
       con el texto alineado al lado correspondiente: con puntos muy juntos en
       linea (p.ej. varios puntos de un diagrama de dispersion casi alineados)
       el desplazamiento solo vertical no basta para separar las etiquetas. */
    const vCandidates = preferAbove ? [-10,18,-24,32] : [18,-10,32,-24];
    const candidates = [];
    for (const dy of vCandidates) candidates.push([0, dy, 'middle']);
    for (const dy of vCandidates) candidates.push([9, dy, 'start']);
    for (const dy of vCandidates) candidates.push([-9, dy, 'end']);
    let best = null, bestScore = Infinity;
    for (const [dx, dy, anchor] of candidates){
      const tx = cx + dx, ty = cy + dy;
      let box;
      if (anchor === 'middle') box = { x0: tx - w/2, x1: tx + w/2, y0: ty - LABEL_H, y1: ty + 2 };
      else if (anchor === 'start') box = { x0: tx, x1: tx + w, y0: ty - LABEL_H, y1: ty + 2 };
      else box = { x0: tx - w, x1: tx, y0: ty - LABEL_H, y1: ty + 2 };
      let score = 0;
      for (const pb of placedBoxes) score += overlapArea(box, pb);
      if (score === 0) { best = { tx, ty, anchor, box }; break; }
      if (score < bestScore){ bestScore = score; best = { tx, ty, anchor, box }; }
    }
    /* si ni siquiera la mejor opcion queda libre de choques (puntos muy
       apretados, por ejemplo 7-8 datos casi alineados en un espacio de
       320x320), es mejor omitir esa etiqueta que mostrar texto solapado e
       ilegible: la cuadricula sigue permitiendo leer el valor aproximado. */
    if (bestScore > 6) return null;
    placedBoxes.push(best.box);
    return best;
  }
  let ptsSvg = '';
  pts.forEach(([x,y], i) => {
    const ptCls = connect ? 'adg-pt' : ((i % 2 === 0) ? 'adg-pt' : 'adg-pt2');
    const cx = sx(x), cy = sy(y);
    const preferAbove = cy > pad + spanY*0.18;
    ptsSvg += `<circle cx="${cx}" cy="${cy}" r="4" class="${ptCls}"/>`;
    if (showLabels){

    <text x="${size/2}" y="${cy+r+34}" class="adg-vcount-neither" text-anchor="middle">${t('ninguno')}: ${numToStr(d.neither)}</text>
  </svg>`;

/* --- barras y tarta: datos categoricos "etiqueta numero" o "x=.. con frecuencias f=.." --- */
const STAT_WORDS_RE = /\b(median|mean|mode|range|iqr|variance|deviation|frequency density|quartile|mediana|media|moda|rango|desviacion|varianza|cuartil)\b/i;
function parseBarData(txt){
  if (!txt || parseVennData(txt)) return null;
  let m = txt.match(/(\d+(?:\s*,\s*\d+)+)\s*(?:\$\s*)?with\s+frequenc\w*\s*(?:\$)?\s*f?\s*=?\s*\$?\s*(\d+(?:\s*,\s*\d+)+)/i);
  if (m){
    const labels = m[1].split(',').map(s => s.trim());
    const values = m[2].split(',').map(s => +s.trim());
    if (labels.length === values.length && labels.length >= 3) return { labels, values };
  }
  let seg = txt;
  if (seg.includes(':')) seg = seg.split(':').slice(1).join(':');
  seg = seg.split(/\.\s[A-Z(]/)[0];
  const chunks = seg.split(/,|\band\b|;/).map(c => c.trim().replace(/^\$|\$$|\.$/g,'').trim()).filter(Boolean);
  const pairsWN = [], pairsNW = [];
  for (const c of chunks){
    if (STAT_WORDS_RE.test(c)) continue;
    let mm = c.match(/^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s\-]{1,20}?)\s+\$?(\d+(?:\.\d+)?)\$?$/);
    if (mm) pairsWN.push([mm[1].trim(), +mm[2]]);
    mm = c.match(/^\$?(\d+(?:\.\d+)?)\$?\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s\-]{1,20}?)$/);
    if (mm) pairsNW.push([mm[2].trim(), +mm[1]]);
  }
  const uniq = arr => new Set(arr.map(p => p[0])).size === arr.length;
  if (pairsWN.length >= 3 && uniq(pairsWN)) return { labels: pairsWN.map(p=>p[0]), values: pairsWN.map(p=>p[1]) };
  if (pairsNW.length >= 3 && uniq(pairsNW)) return { labels: pairsNW.map(p=>p[0]), values: pairsNW.map(p=>p[1]) };
  return null;
}
function svgBarChart(labels, values){
  const W = 340, H = 260, padL = 38, padB = 46, padT = 18, padR = 14;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = Math.max(...values) * 1.18 || 1;
  const n = labels.length, gap = plotW / n, bw = gap * 0.6;
  let bars = '', xlabels = '';
  values.forEach((v,i) => {
    const h = (v / maxV) * plotH;
    const x = padL + gap*i + (gap-bw)/2, y = padT + plotH - h;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" class="${i%2===0?'adg-bar':'adg-bar2'}"/>`;
    bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" class="adg-bar-val" text-anchor="middle">${numToStr(v)}</text>`;
    xlabels += `<text x="${(x+bw/2).toFixed(1)}" y="${(padT+plotH+14).toFixed(1)}" class="adg-bar-label" text-anchor="middle">${esc(String(labels[i]).slice(0,12))}</text>`;
  });
  let axes = `<line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" class="adg-axis"/>`;
  axes += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" class="adg-axis"/>`;
  const yStep = niceStep(maxV);
  let yticks = '';
  for (let k=0; k<=maxV; k+=yStep){
    const y = padT+plotH-(k/maxV)*plotH;
    yticks += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" class="adg-tick" text-anchor="end">${numToStr(k)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${axes}${yticks}${bars}${xlabels}</svg>`;
}
function svgPieChart(labels, values){
  const size = 320, cx = 118, cy = 150, r = 92;
  const total = values.reduce((a,b)=>a+b,0) || 1;
  const colors = ['#0e7a68','#c17a17','#2f6fb3','#a24f8f','#5c8a3a','#b3462f'];
  let angle = -90, slices = '', legend = '';
  const toRad = d => d*Math.PI/180;
  values.forEach((v,i) => {
    const frac = v/total, a0 = angle, a1 = angle + frac*360;
    angle = a1;
    const large = (a1-a0) > 180 ? 1 : 0;
    const x0 = cx+r*Math.cos(toRad(a0)), y0 = cy+r*Math.sin(toRad(a0));
    const x1 = cx+r*Math.cos(toRad(a1)), y1 = cy+r*Math.sin(toRad(a1));
    const color = colors[i % colors.length];
    slices += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${color}" fill-opacity="0.82" stroke="#fbfcfd" stroke-width="1.5"/>`;
    legend += `<rect x="236" y="${26+i*23}" width="11" height="11" fill="${color}"/><text x="251" y="${35+i*23}" class="adg-legend-text">${esc(String(labels[i]).slice(0,14))} (${numToStr(v)})</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${slices}${legend}</svg>`;
}

/* --- histograma: clases "a<x<=b freq N" o densidades de frecuencia directas --- */
function parseHistogramData(txt){
  if (!txt) return null;
  const isDensity = /densit/i.test(txt);
  const pat = isDensity
    ? /\$?\s*(-?\d+(?:\.\d+)?)\s*(?:<|\\le|\\leq|≤)\s*[a-zA-Zℓ]\s*(?:<|\\le|\\leq|≤)\s*(-?\d+(?:\.\d+)?)\s*\$?\s*[,:]?\s*\$?\s*(\d+(?:\.\d+)?)\$?/gi
    : /\$?\s*(-?\d+(?:\.\d+)?)\s*(?:<|\\le|\\leq|≤)\s*[a-zA-Zℓ]\s*(?:<|\\le|\\leq|≤)\s*(-?\d+(?:\.\d+)?)\s*\$?[,:]?\s*(?:freq\.?|frequency)\s*\$?\s*(\d+(?:\.\d+)?)\$?/gi;
  const matches = [...txt.matchAll(pat)];
  if (matches.length < 3) return null;
  const classes = matches.map(m => {
    const lo = +m[1], hi = +m[2], val = +m[3];
    const width = hi - lo;
    if (!(width > 0)) return null;
    return { lo, hi, density: isDensity ? val : val/width, freq: isDensity ? val*width : val };
  });
  if (classes.some(c => !c)) return null;
  for (let i=1;i<classes.length;i++) if (classes[i].lo < classes[i-1].hi - 1e-9) return null;
  return classes;
}
function svgHistogram(classes){
  const W = 340, H = 260, padL = 40, padB = 40, padT = 18, padR = 14;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const x0 = classes[0].lo, x1 = classes[classes.length-1].hi;
  const totalWidth = x1-x0 || 1;
  const maxDensity = Math.max(...classes.map(c=>c.density)) * 1.18 || 1;
  const sx = v => padL + (v-x0)/totalWidth*plotW;
  const sy = v => padT + plotH - (v/maxDensity)*plotH;
  let bars = '', xticks = '';
  classes.forEach((c,i) => {
    const bx = sx(c.lo), bx2 = sx(c.hi), by = sy(c.density);
    bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(bx2-bx).toFixed(1)}" height="${(padT+plotH-by).toFixed(1)}" class="${i%2===0?'adg-bar':'adg-bar2'}"/>`;
    xticks += `<text x="${bx.toFixed(1)}" y="${(padT+plotH+14).toFixed(1)}" class="adg-tick" text-anchor="middle">${numToStr(c.lo)}</text>`;
  });
  xticks += `<text x="${sx(x1).toFixed(1)}" y="${(padT+plotH+14).toFixed(1)}" class="adg-tick" text-anchor="middle">${numToStr(x1)}</text>`;
  let axes = `<line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" class="adg-axis"/>`;
  axes += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" class="adg-axis"/>`;
  const yStep = niceStep(maxDensity);
  let yticks = '';
  for (let k=0; k<=maxDensity; k+=yStep){
    const y = sy(k);
    yticks += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" class="adg-tick" text-anchor="end">${numToStr(k)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${axes}${yticks}${bars}${xticks}</svg>`;
}

/* --- curva normal: mu/sigma explicitos, sombreada si el enunciado pide P(a<X<b) --- */
function parseNormalData(txt){
  if (!txt) return null;
  const muM = txt.match(/\\mu\s*=\s*(-?\d+(?:\{,\}\d+|\.\d+)?)/);
  const sigM = txt.match(/\\sigma\s*=\s*(\d+(?:\{,\}\d+|\.\d+)?)/);
  if (!muM || !sigM) return null;
  const mu = parseNumLatex(muM[1]), sigma = parseNumLatex(sigM[1]);
  if (!isFinite(mu) || !isFinite(sigma) || sigma <= 0) return null;
  let a = null, b = null;
  const rangeM = txt.match(/P\s*\(\s*(-?\d+(?:\{,\}\d+|\.\d+)?)\s*<\s*X\s*<\s*(-?\d+(?:\{,\}\d+|\.\d+)?)\s*\)/);
  if (rangeM){ a = parseNumLatex(rangeM[1]); b = parseNumLatex(rangeM[2]); }
  return { mu, sigma, a, b };
}
function svgNormalCurve(mu, sigma, a, b){
  const W = 340, H = 220, padL = 32, padB = 32, padT = 16, padR = 14;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xMin = mu-3.5*sigma, xMax = mu+3.5*sigma;
  const sx = x => padL + (x-xMin)/(xMax-xMin)*plotW;
  const pdf = x => Math.exp(-0.5*Math.pow((x-mu)/sigma,2));
  const N = 60, pts = [];
  for (let i=0;i<=N;i++){ const x = xMin+(xMax-xMin)*i/N; pts.push([x, pdf(x)]); }
  const sy = y => padT + plotH - y*plotH*0.92;
  const pathD = pts.map((p,i) => `${i===0?'M':'L'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  let shade = '';
  if (a != null && b != null && isFinite(a) && isFinite(b)){
    const lo = Math.max(a, xMin), hi = Math.min(b, xMax);
    if (hi > lo){
      const M = 30, sp = [];
      for (let i=0;i<=M;i++){ const x = lo+(hi-lo)*i/M; sp.push([x, pdf(x)]); }
      let d = `M${sx(lo).toFixed(1)},${sy(0).toFixed(1)} ` + sp.map(p => `L${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ') + ` L${sx(hi).toFixed(1)},${sy(0).toFixed(1)} Z`;
      shade = `<path d="${d}" class="adg-normal-shade"/>`;
    }
  }
  let axis = `<line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" class="adg-axis"/>`;
  let muLine = `<line x1="${sx(mu).toFixed(1)}" y1="${padT}" x2="${sx(mu).toFixed(1)}" y2="${padT+plotH}" class="adg-grid"/>`;
  let muLabel = `<text x="${sx(mu).toFixed(1)}" y="${(padT+plotH+15).toFixed(1)}" class="adg-tick" text-anchor="middle">&#956;=${numToStr(mu)}</text>`;
  let abLabel = '';
  if (a != null) abLabel += `<text x="${sx(Math.max(a,xMin)).toFixed(1)}" y="${padT-4}" class="adg-tick" text-anchor="middle">${numToStr(a)}</text>`;
  if (b != null) abLabel += `<text x="${sx(Math.min(b,xMax)).toFixed(1)}" y="${padT-4}" class="adg-tick" text-anchor="middle">${numToStr(b)}</text>`;
  const curve = `<path d="${pathD}" class="adg-normal-curve" fill="none"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${axis}${muLine}${shade}${curve}${abLabel}${muLabel}</svg>`;
}

function autoChart(e, unitId){
  if (e.assets && e.assets.length) return '';
  if (!statsUnitMatch(unitId)) return '';
  const txt = str(e.statement||'');
  if (!txt) return '';
  try {
    const venn = parseVennData(txt);
    if (venn){ const svg = svgVenn(venn); if (svg) return wrapFig(svg, t('diagrama_no_escala')); }
  } catch (err) {}
  try {
    /* un enunciado con mu y sigma no siempre describe la variable como normal:
       - la desigualdad de Chebyshev usa mu/sigma SIN suponer normalidad (ese es
         precisamente el punto de la leccion): dibujar una campana ahi contradice
         lo que se esta enseñando.
       - el teorema central del limite / distribucion muestral habla de una
         muestra de tamaño n: la distribucion relevante tiene desviacion tipica
         sigma/sqrt(n), no sigma. Dibujar la campana con el sigma de la poblacion
         (el unico que el parser sabe leer) seria una campana demasiado ancha y
         enseñaria al alumno una forma incorrecta.
       Por eso solo se genera cuando el enunciado dice explicitamente que la
       variable es normal/gaussiana Y no hay de por medio ni Chebyshev ni una
       muestra/teorema central del limite. */
    const mentionsNormal = /normal distribution|distribuci[oó]n normal|campana de gauss|gaussian|\bN\(/i.test(txt);
    const mentionsChebyshev = /chebyshev|chebichev|tchebychev/i.test(txt);
    const mentionsSampling = /muestra|muestral|teorema central del l[ií]mite|central limit|tama[ñn]o de (la )?muestra|\bsample\b/i.test(txt);
    if (mentionsNormal && !mentionsChebyshev && !mentionsSampling){
      const nd = parseNormalData(txt);
      if (nd){ const svg = svgNormalCurve(nd.mu, nd.sigma, nd.a, nd.b); if (svg) return wrapFig(svg, t('diagrama_no_escala')); }
    }
  } catch (err) {}
  try {
    /* el patron "a<x<=b freq N" tambien aparece en ejercicios de frecuencia
       acumulada, de medidas de dispersion o de tabulacion que NO piden un
       histograma: dibujar ahi un histograma de frecuencia/anchura no ayuda al
       alumno con lo que se le pide y puede confundirlo. Solo se genera cuando
       el enunciado habla explicitamente de histograma o densidad de frecuencia. */
    if (/histogram|frequency density|histograma|densidad de frecuencia/i.test(txt)){
      const hist = parseHistogramData(txt);
      if (hist){ const svg = svgHistogram(hist); if (svg) return wrapFig(svg, t('diagrama_no_escala')); }
    }
  } catch (err) {}
  try {
    const bar = parseBarData(txt);
    if (bar){
      const isPie = /pie chart|sector|angle of each/i.test(txt);
      const svg = isPie ? svgPieChart(bar.labels, bar.values) : svgBarChart(bar.labels, bar.values);
      if (svg) return wrapFig(svg, t('diagrama_no_escala'));
    }
  } catch (err) {}
  return '';
}

/* --- Ilustraciones conceptuales para Teoria ---
   Muchos bloques de teoria de Estadistica/Probabilidad EXPLICAN un tipo de grafico
   concreto (barras, tarta, histograma, dispersion, frecuencia acumulada, normal, Venn)
   pero no traen su propio recurso visual (el autor del bloque escribio la explicacion
   en prosa). Aqui, cuando el titulo o el cuerpo del bloque nombra claramente ese tipo
   de grafico y el bloque no tiene ya un asset propio, se genera un ejemplo ilustrativo
   generico (datos de muestra, nunca inventados a partir del enunciado real) para que el
   alumno vea el tipo de grafico mientras lee la teoria, en vez de solo texto. Reutiliza
   los mismos generadores SVG y la misma paleta que los autodiagramas de Ejercicios. */
const CONCEPT_CHART_PATTERNS = [
  ['venn', /venn|diagrama de venn|\bconjuntos\b/i],
  ['cumulative', /cumulative frequency|frecuencia acumulada|\bojiva\b/i],
  ['histogram', /histogram|histograma/i],
  ['scatter', /scatter diagram|scatter graph|diagrama de dispersi[oó]n|nube de puntos|\bcorrelaci[oó]n/i],
  ['pie', /pie chart|diagrama circular|gr[aá]fico circular/i],
  ['bar', /bar chart|diagrama(?:s)? de barras|gr[aá]fico(?:s)? de barras/i],
  ['normal', /normal distribution|distribuci[oó]n normal|curva normal|campana de gauss/i],
  ['twoway', /two-way tables?|tabla(?:s)? de doble entrada/i],
];
function conceptChartKind(text){
  /* una introduccion que compara varios diagramas a la vez (ej. "sample space,
     Venn y tree diagram son tres formas de...") no pertenece a NINGUNO en
     particular: si se deja, roba el hueco (seenKinds) al bloque que de verdad
     explica ese diagrama. Se excluye ese caso muy especifico antes de buscar
     coincidencia normal. */
  if (/sample space diagram/i.test(text) && /tree diagram/i.test(text) && /venn/i.test(text)) return null;
  for (const [kind, re] of CONCEPT_CHART_PATTERNS) if (re.test(text)) return kind;
  return null;
}

function svgConceptTanGraph(){

/* --- volumen de un solido de revolucion: gira f(x) alrededor del eje OX entre
   x=a y x=b. Se dibuja el perfil f(x) y su reflejo -f(x) (silueta del solido
   visto de lado), con el eje OX y los limites de integracion marcados. Solo
   se genera cuando la expresion de f(x) es una de un conjunto reducido y
   seguro de formas (constante, lineal, x^2, x^3, raiz de x, raiz de R^2-x^2):
   si la expresion no se reconoce con certeza, no se dibuja nada en vez de
   arriesgarse a mostrar una curva que no es la del enunciado. Nunca se
   intenta con giros alrededor de OY (requeriria intercambiar los ejes). */
function parseRevolutionFn(expr, Rval){
  expr = String(expr||'').replace(/\\text\{[^}]*\}/g,'').replace(/\\,/g,'').replace(/\s+/g,'');
  if (/^-?\d+(\.\d+)?$/.test(expr)){ const c = parseFloat(expr); return x=>c; }
  if (expr === 'x') return x=>x;
  if (expr === '-x') return x=>-x;
  let m = expr.match(/^(-?\d+(?:\.\d+)?)x$/);
  if (m){ const k = parseFloat(m[1]); return x=>k*x; }
  m = expr.match(/^x\^\{?(\d)\}?$/);
  if (m){ const n = parseInt(m[1],10); return x=>Math.pow(x,n); }
  if (/^\\?sqrt\{?x\}?$/.test(expr)) return x => x>=0?Math.sqrt(x):NaN;
  if (/^\\?sqrt\{?R\^\{?2\}?-x\^\{?2\}?\}?$/.test(expr)){
    return x => { const v = Rval*Rval-x*x; return v>=0?Math.sqrt(v):NaN; };
  }
  return null;
}
function parseBoundVal(s, Rval){
  s = String(s||'').trim();
  if (s === 'R') return Rval;
  if (s === '-R') return -Rval;
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function revolutionFromText(txt){
  if (!txt) return null;
  if (!/\bOX\b/.test(txt)) return null;
  if (!/girar|girando/i.test(txt)) return null;
  const fm = txt.match(/\$\s*(?:f\(x\)|y)\s*=\s*([^$]+?)\s*\$/);
  if (!fm) return null;
  const im = txt.match(/entre\s*\$\s*x\s*=\s*(-?[\w.]+)\s*\$\s*y\s*\$\s*x\s*=\s*(-?[\w.]+)\s*\$/i);
  if (!im) return null;
  const Rval = 3;
  const fn = parseRevolutionFn(fm[1], Rval);
  if (!fn) return null;
  const a = parseBoundVal(im[1], Rval), b = parseBoundVal(im[2], Rval);
  if (a == null || b == null || !(b > a)) return null;
  const N = 48;
  const samples = [];
  for (let i=0;i<=N;i++){
    const x = a + (b-a)*i/N;
    const y = fn(x);
    if (!isFinite(y)) return null;
    samples.push([x,y]);
  }
  const yMax = Math.max(0.5, ...samples.map(s=>Math.abs(s[1])));
  return svgRevolution({ samples, a, b, yMax });
}
function svgRevolution(data){
  const { samples, a, b, yMax } = data;
  const width = 300, padSide = 30, padTop = 18, padBottom = 38, plotH = 160;
  const height = padTop + plotH + padBottom;
  const plotW = width - 2*padSide;
  const sx = v => padSide + (v-a)/(b-a)*plotW;
  const yRange = yMax * 1.25;
  const sy = v => padTop + plotH/2 - (v/yRange)*(plotH/2);
  const axisY = sy(0);
  const defs = `<defs><marker id="adg-rev-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#24312c"/></marker></defs>`;
  const upperPts = samples.map(([x,y]) => `${sx(x).toFixed(1)},${sy(y).toFixed(1)}`).join(' ');
  const lowerPts = samples.map(([x,y]) => `${sx(x).toFixed(1)},${sy(-y).toFixed(1)}`).join(' ');
  const lowerPtsRev = samples.slice().reverse().map(([x,y]) => `${sx(x).toFixed(1)},${sy(-y).toFixed(1)}`).join(' ');
  const shade = `<polygon points="${upperPts} ${lowerPtsRev}" class="adg-tri" fill-opacity="0.55" stroke="none"/>`;
  const curveUpper = `<polyline points="${upperPts}" fill="none" class="adg-line"/>`;
  const curveLower = `<polyline points="${lowerPts}" fill="none" stroke="#8a978f" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/>`;
  const axis = `<line x1="${padSide-6}" y1="${axisY}" x2="${width-padSide+8}" y2="${axisY}" class="adg-axis" marker-end="url(#adg-rev-arrow)"/>` +
    `<text x="${width-padSide+2}" y="${axisY-8}" class="adg-axislabel">OX</text>`;
  const boundA = `<line x1="${sx(a)}" y1="${padTop-4}" x2="${sx(a)}" y2="${padTop+plotH+4}" stroke="#9aa39d" stroke-width="1.3"/>` +
    `<text x="${sx(a)}" y="${padTop+plotH+18}" class="adg-tick" text-anchor="middle">x=${numToStr(a)}</text>`;
  const boundB = `<line x1="${sx(b)}" y1="${padTop-4}" x2="${sx(b)}" y2="${padTop+plotH+4}" stroke="#9aa39d" stroke-width="1.3"/>` +
    `<text x="${sx(b)}" y="${padTop+plotH+18}" class="adg-tick" text-anchor="middle">x=${numToStr(b)}</text>`;
  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">${defs}${shade}${curveUpper}${curveLower}${axis}${boundA}${boundB}</svg>`;
}

  if (!block || (block.assets && block.assets.length)) return '';

      if (svg) return wrapFig(svg, t('diagrama_no_escala'));

    if (/INTEGRAL/.test(uid) && /girar|girando/i.test(txt)){

  } catch (err) { /* un fallo al generar el diagrama nunca debe romper el render */ }
  return '';
}

/* bancos de 100-500+ ejercicios no deben renderizarse de una sola vez (eso
   es lo que deja la pestana "pillada" mientras el navegador monta cientos de
   bloques): cada seccion grande se reparte en tandas con un selector, y solo
   se monta en el DOM la tanda activa. */
const EJ_BATCH = 50;
function viewEjercicios(el, d){
  const uid = d.unit_id;
  const conceptMap = buildConceptMap(d.keywords);
  const sections = [
    [t('ejemplos_resueltos'), d.worked_examples, null, 'we'],
    [t('ejercicios_guiados'), d.guided_exercises, null, 'ge'],
    [t('ejercicios'), d.exercises, null, 'ex'],
    [t('preguntas_examen'), d.exam_questions, e => e.marks ? `<div class="marks">[${e.marks} ${t('puntos')}]</div>` : '', 'eq'],
    [t('desafios'), d.challenge_questions, null, 'cq'],
  ];
  let html = '';
  const batched = [];
  sections.forEach(([title, arr, extra, key]) => {
    if (!arr?.length) return;
    html += `<h2>${title} <span class="chip">${arr.length}</span></h2>`;
    if (arr.length > EJ_BATCH){
      const nChunks = Math.ceil(arr.length / EJ_BATCH);
      let bar = `<div class="ejbatchbar" data-batchbar="${key}">`;
      for (let c = 0; c < nChunks; c++){
        const from = c*EJ_BATCH+1, to = Math.min(arr.length, (c+1)*EJ_BATCH);
        bar += `<button class="${c===0?'on':''}" data-batch="${key}:${c}">${from}–${to}</button>`;
      }
      html += bar + '</div>' + `<div data-ejcontent="${key}"></div>`;
      batched.push({key, arr, extra});
    } else {
      html += arr.map(e => exBlock(e, extra, uid, conceptMap)).join('');
    }
  });
  el.innerHTML = html || `<div class="empty">${t('sin_ejercicios')}</div>`;
  function renderChunk(b, chunkIdx){
    const target = el.querySelector(`[data-ejcontent="${b.key}"]`);
    if (!target) return;
    const from = chunkIdx*EJ_BATCH, to = Math.min(b.arr.length, from+EJ_BATCH);
    target.innerHTML = b.arr.slice(from, to).map(e => exBlock(e, b.extra, uid, conceptMap)).join('');
    typeset();
  }
  batched.forEach(b => renderChunk(b, 0));
  el.querySelectorAll('[data-batch]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [key, idxStr] = btn.dataset.batch.split(':');
      const b = batched.find(x => x.key === key);
      if (!b) return;
      el.querySelectorAll(`[data-batchbar="${key}"] button`).forEach(x => x.classList.remove('on'));
      btn.classList.add('on');
      renderChunk(b, +idxStr);
      try {
        const target = el.querySelector(`[data-ejcontent="${key}"]`);
        if (target && target.scrollIntoView) target.scrollIntoView({block:'start', behavior:'smooth'});
      } catch(err) { /* el scroll nunca debe romper el cambio de tanda */ }
    });
  });
}

/* --- Repaso --- */
function viewRepaso(d){
  let out = '';
  const examNotes = asList(d.exam_notes), miscs = asList(d.misconceptions);
  if (examNotes.length)
    out += `<div class="block"><span class="tag">${t('notas_examen')}</span><ul>` +
      examNotes.map(x => `<li>${mdi(str(x))}</li>`).join('') + '</ul></div>';
  if (miscs.length){
    out += `<h2>${t('conceptos_erroneos')}</h2>`;
    miscs.forEach(m => {
      if (typeof m === 'string') m = { incorrect_model: m };
      out += `<div class="block"><p><strong>${t('modelo_erroneo')}</strong> ${mdi(m.incorrect_model)}</p>`;
      if (m.correct_model) out += `<p><strong>${t('modelo_correcto')}</strong> ${mdi(m.correct_model)}</p>`;
      if (m.why_it_appears) out += det(t('por_que_aparece'), md(m.why_it_appears));
      if (m.diagnostic_signal) out += det(t('como_detectarlo'), md(m.diagnostic_signal));
      if (m.remediation) out += det(t('como_corregirlo'), md(str(m.remediation)));
      out += '</div>';
    });
  }
  if (d.common_mistakes?.length){
    out += `<h2>${t('errores_comunes')}</h2>`;
    d.common_mistakes.forEach(m => {
      out += `<div class="block"><p><strong>${mdi(m.mistake)}</strong></p>`;
      if (m.why) out += `<p>${mdi(m.why)}</p>`;
      if (m.how_to_avoid) out += `<p><strong>${t('como_evitarlo')}</strong> ${mdi(m.how_to_avoid)}</p>`;
      out += '</div>';
    });
  }
  if (d.prerequisites?.length)
    out += `<h2>${t('requisitos_previos')}</h2>` + d.prerequisites.map(p => typeof p === 'string' ? `<div class="block"><p><strong>${mdi(p)}</strong></p></div>` :
      `<div class="block"><p><strong>${mdi(p.statement)}</strong></p>${p.why_it_matters ? `<p>${mdi(p.why_it_matters)}</p>`:''}</div>`).join('');
  if (d.diagnostic_items?.length){
    out += `<h2>${t('diagnostico_previo')}</h2>`;
    d.diagnostic_items.forEach((q,i2) => {
      let inner = `<p><strong>${t('respuesta_esperada')}</strong> ${mdi(q.expected_answer)}</p>`;
      (q.common_wrong_answers||[]).forEach(w => {
        inner += `<p>✗ <em>${mdi(str(w.answer||w))}</em>${w.interpretation? ' — '+mdi(w.interpretation):''}</p>`;
      });
      if (q.interpretation) inner += `<p><strong>${t('que_comprueba')}</strong> ${mdi(q.interpretation)}</p>`;
      if (q.remediation_action) inner += `<div class="callout info"><strong>${t('si_fallas')}</strong> ${mdi(q.remediation_action)}</div>`;
      out += `<div class="q"><div class="stem">${i2+1}. ${mdi(q.question)}</div>${det(t('ver_respuesta'), inner)}</div>`;
    });
  }
  return out || `<div class="empty">${t('sin_repaso')}</div>`;
}

}

/* ---------- datos cifrados ----------
   En la web publicada catalog.json y bundles/ no existen: se sirven cifrados en cifrado/*.bin
   (generados con cifrar.js). En localhost se usan los JSON en claro si están; ?cifrado fuerza el modo cifrado. */
const KEY_STORE = 'nebula_key';
let PLAIN = ['localhost', '127.0.0.1'].includes(location.hostname) && !/[?&]cifrado\b/.test(location.search);
let KEY = null;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptJSON(buf, key){
  const bytes = new Uint8Array(buf);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function loadJSON(file){
  if (PLAIN) return (await fetch(file + '?v=' + Date.now())).json();
  const r = await fetch('cifrado/' + file.replace(/\.json$/, '.bin') + '?v=' + Date.now());
  if (!r.ok) throw new Error(r.status);
  return decryptJSON(await r.arrayBuffer(), KEY);
}
function readStoredKey(){
  try { return sessionStorage.getItem(KEY_STORE) || localStorage.getItem(KEY_STORE); } catch(e){ return null; }
}
function forgetKey(){
  try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch(e){}
}
async function keyIsValid(key, meta){
  try { return (await decryptJSON(b64(meta.check), key)).ok === true; } catch(e){ return false; }
}

async function unlock(){
  const meta = await (await fetch('cifrado/meta.json?v=' + Date.now())).json();
  const stored = readStoredKey();
  if (stored){
    const key = await crypto.subtle.importKey('raw', b64(stored), 'AES-GCM', true, ['decrypt']);
    if (await keyIsValid(key, meta)) return key;
    forgetKey();
  }
  setCrumbs([]);
  $main.innerHTML = `<form class="lock" id="lockForm">
    <h1>Nebula Cursos</h1>
    <p>Introduce la contraseña para acceder a los cursos.</p>
    <input type="password" id="lockPass" autocomplete="current-password" aria-label="Contraseña" required>
    <label><input type="checkbox" id="lockRemember"> Recordar en este dispositivo</label>
    <button class="btn" type="submit">Entrar</button>
    <div class="lock-err" id="lockErr" role="alert"></div>
  </form>`;
  const $form = document.getElementById('lockForm'), $pass = document.getElementById('lockPass');
  const $err = document.getElementById('lockErr'), $btn = $form.querySelector('button');
  $pass.focus();
  return new Promise(resolve => {
    $form.addEventListener('submit', async e => {
      e.preventDefault();
      $btn.disabled = true; $err.textContent = '';
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($pass.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      if (!(await keyIsValid(key, meta))){
        $btn.disabled = false; $err.textContent = 'Contraseña incorrecta.'; $pass.select(); return;
      }
      const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))));
      try { (document.getElementById('lockRemember').checked ? localStorage : sessionStorage).setItem(KEY_STORE, raw); } catch(e){}
      resolve(key);
    });
  });
}

/* ---------- arranque ---------- */
async function start(){
  if (PLAIN){
    try {
      const r = await fetch('catalog.json?v=' + Date.now());
      if (r.ok){ CAT = await r.json(); render(); return; }
    } catch(e){}
    PLAIN = false;
  }
  try { KEY = await unlock(); }
  catch(e){ $main.innerHTML = '<div class="empty">No se pudo cargar la web. Comprueba la conexión y vuelve a intentarlo.</div>'; return; }
  const out = document.createElement('button');
  out.className = 'lockout'; out.type = 'button'; out.textContent = 'Salir';
  out.addEventListener('click', () => { forgetKey(); location.hash = ''; location.reload(); });
  document.querySelector('.appbar').appendChild(out);
  $main.innerHTML = '<div class="loading">Cargando catálogo…</div>';
  try { CAT = await loadJSON('catalog.json'); render(); }
  catch(e){ $main.innerHTML = '<div class="empty">No se pudo cargar el catálogo.</div>'; }
}
start();
</script>
